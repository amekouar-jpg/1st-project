<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Utilisateurs Connectés</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 30px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-box {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-box h3 {
      font-size: 14px;
      font-weight: normal;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .stat-box .number {
      font-size: 32px;
      font-weight: bold;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }

    button:hover {
      background: #764ba2;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    thead {
      background: #f5f5f5;
      border-bottom: 2px solid #ddd;
    }

    th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      color: #333;
      font-size: 13px;
      text-transform: uppercase;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid #eee;
      color: #666;
      font-size: 14px;
    }

    tr:hover {
      background: #f9f9f9;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-online {
      background: #d4edda;
      color: #155724;
    }

    .no-data {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    .success {
      background: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    .timestamp {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔒 Admin - Tableau de Bord</h1>
    <p class="subtitle">Gestion des utilisateurs connectés</p>

    <div id="alert" style="display: none;"></div>

    <div class="stats">
      <div class="stat-box">
        <h3>Utilisateurs Connectés</h3>
        <div class="number" id="totalUsers">0</div>
      </div>
    </div>

    <div class="controls">
      <button onclick="loadUsers()">🔄 Rafraîchir</button>
      <button onclick="exportCSV()">📥 Exporter CSV</button>
      <button onclick="location.href='/login.html'">← Retour</button>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom d'utilisateur</th>
            <th>Email</th>
            <th>Nom Complet</th>
            <th>Inscrit le</th>
            <th>Dernière Connexion</th>
            <th>Connexions (Total)</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr>
            <td colspan="7" class="loading">Chargement...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Load users on page load
    document.addEventListener('DOMContentLoaded', loadUsers);

    function loadUsers() {
      fetch('/api/users')
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          const users = data.users || [];
          const tbody = document.getElementById('usersTableBody');
          
          document.getElementById('totalUsers').innerText = users.length;

          if (users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="no-data">Aucun utilisateur connecté</td></tr>';
            return;
          }

          tbody.innerHTML = users.map(user => `
            <tr>
              <td>${user.id || '-'}</td>
              <td><strong>${user.username || '-'}</strong></td>
              <td>${user.email || '-'}</td>
              <td>${user.fullName || '-'}</td>
              <td><span class="timestamp">${formatDate(user.createdAt)}</span></td>
              <td><span class="timestamp">${formatDate(user.lastLogin)}</span></td>
              <td><span class="status-badge status-online">${user.loginCount || 0} fois</span></td>
            </tr>
          `).join('');

          showAlert(`${users.length} utilisateur(s) trouvé(s)`, 'success');
        })
        .catch(error => {
          console.error('Error:', error);
          document.getElementById('usersTableBody').innerHTML = 
            `<tr><td colspan="7" class="no-data">Erreur: ${error.message}</td></tr>`;
          showAlert(`Erreur: ${error.message}`, 'error');
        });
    }

    function formatDate(dateString) {
      if (!dateString) return 'N/A';
      const date = new Date(dateString);
      return date.toLocaleString('fr-FR');
    }

    function exportCSV() {
      fetch('/api/users')
        .then(response => response.json())
        .then(data => {
          const users = data.users || [];
          if (users.length === 0) {
            showAlert('Aucun utilisateur à exporter', 'error');
            return;
          }

          const csv = [
            ['ID', 'Nom d\'utilisateur', 'Email', 'Nom Complet', 'Inscrit le', 'Dernière Connexion', 'Connexions'],
            ...users.map(u => [
              u.id || '',
              u.username || '',
              u.email || '',
              u.fullName || '',
              formatDate(u.createdAt),
              formatDate(u.lastLogin),
              u.loginCount || 0
            ])
          ].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');

          const blob = new Blob([csv], { type: 'text/csv' });
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `utilisateurs_${new Date().toISOString().slice(0, 10)}.csv`;
          a.click();
          window.URL.revokeObjectURL(url);
          showAlert('Export CSV réussi!', 'success');
        })
        .catch(error => showAlert(`Erreur: ${error.message}`, 'error'));
    }

    function showAlert(message, type) {
      const alertDiv = document.getElementById('alert');
      alertDiv.className = type === 'error' ? 'error' : 'success';
      alertDiv.innerText = message;
      alertDiv.style.display = 'block';
      setTimeout(() => alertDiv.style.display = 'none', 5000);
    }

    // Auto-refresh every 30 seconds
    setInterval(loadUsers, 30000);
  </script>
</body>
</html>
